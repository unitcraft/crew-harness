# nova.toml - crew_harness: the CrewHarness product on Nova.
#
# Layout (the same as claude-limits): ALL `.nv` UNDER `src/`, not one file in the package
# root. Owner's rule 2026-09-07 ("никаких .nv файлов в корне"), stricter than the spec, which
# leaves the flat layout legal but not recommended.
#
# No `bin/` anywhere: the entry point is plainly `src/crew_harness.nv`, built binaries go to
# `target/` (or are ignored if `nova build` drops them beside the source, see .gitignore).
#
# `src/chat/` is the machine of a chat session with an agent; tests are peer files `*_test.nv` beside the sources. Build: Nova Oracle 0.1.0,
# Clang, see `spikes/env/README.md`. The state machine engine and the core of the machines as data (the tree, the translator of tables, the interpreter, the
# program `alula`) live in the package `alula` (task 144), a dependency below; its modules are `alula.engine`, `alula.machine`, `alula.machine_run` and so on.
#
# Dependencies (foreign packages, read only): the PostgreSQL driver `postgres` (nova-postgres) for the PostgreSQL handlers of
# `Journal` and `Store` in `src/pg*` (task 098), and Polaris (`polaris`, with its `http` and `tls`) for the front of the session
# server, `src/server/front/` (task 099). The two cannot be in one program on Oracle 0.1.0, so the hub (`src/crew_hub.nv`) holds
# the driver and the front (`src/crew_harness.nv`) holds Polaris; the rest uses `std` and `alula`. `nova.lock.toml` fixes the build.

[lib]
src = "src"

[dependencies]
postgres = { git = "https://github.com/nv-lang/nova-postgres", version = "0.1" }
polaris = { git = "https://github.com/nv-lang/nova-polaris", version = "0.2" }
http = { git = "https://github.com/nv-lang/nova-http", version = "0.2" }
tls = { git = "https://github.com/nv-lang/nova-tls", version = "0.2" }
# The core of the machines as data (task 144, published as nv-lang/nova-alula): the package `alula`. Version 0.2 (task 148) is the language under the name Alula, the format 2.14, the modules
# `alula.alula_cli`, `alula.alula_scenarios`, `alula.alula_eq` and the program `alula`; version 0.3 (tasks 149, 151 and 152, published once) is Alula 2.22: the rules of 2.13, the semantics of the formats
# 2.15 - 2.17 (the JSON names built by themselves and the section `## Имена`, a party of a free input, the `иначе` of a fork only where the type does not prove the exhaustion) and the syntax of the
# formats 2.18 - 2.22 (blocks, `=>`, `функция`, ranges, methods of the macros, insertions, `тип Имя перечисление`, the comments, the new lexer).
# Version 0.4 (task 158) is the split of the package and the product: the package holds the language (two primitives, 35 journal codes, spec 7a) and its examples, the registry and the journal
# of a host are data (`registry.md`, `journal.md`); the machines of the product and of the methodology (`machines/`) and the tests that run them live here. The tag v0.4.0 is published (commit 62cb32a), `nova.lock.toml`
# pins it (`nova update alula`); a local `nova.override.toml` (not committed) is only for work on the package itself.
# Version 0.5 (task 172, the tag v0.5.0, commit 9fd413a) is Alula 2.23: the code of a journal entry is a string, three classes of the host functions (`pure`, `volatile`, `acting`), the column `writes` says `actions`;
# the package reads only the format 2.23 (no transition period), the tables of `machines/` are moved to it.
# Version 0.6 (task 184, the tag v0.6.0, commit 8be13fb) is Alula 2.24: the external functions are declared in the file of a machine (the section `## External functions`, the call `name(args)` without `call`),
# a parse of a reply is three functions by role, the host binds the functions by class, the names `require_non_empty`, the priorities of the operators as in Nova; the package reads only the format 2.24,
# the tables of `machines/` are moved to it.
# Version 0.7 (task 225, the tag v0.7.0, commit d816e37) is Alula 2.25: the time is the stamp of the event (`event.at`, the Russian name `событие.момент`), the former function of the time is an error and the only standard
# external function is `new_id`; the functions `time_to_text` and `text_to_time`; the package reads only the format 2.25, the tables of `machines/` are moved to it.
# Version 0.8 (task 230; 0.8.0 renamed the checks, 0.8.1, the tag v0.8.1, commit ae6c943, adds the explicit refusal of the old name `*.scenario.test.json`) renames the checks of the package: the file `*.alula.test.json`, the format `test/0`, the types `Test` and `TestRun`, the functions `parse_test`, `run_test` and so on; the format of the language stays 2.25.
alula = { git = "https://github.com/nv-lang/nova-alula", version = "0.8.1" }

[package]
name = "crew_harness"
version = "0.1.0"
description = "CrewHarness product on Nova: state machine engine with self-contained events, chat session with an agent"
license = "MIT OR Apache-2.0"
repository = "https://github.com/unitcraft/crew-harness"

# [[bin]] is declared by the spec but not read by Oracle 0.1.0 (claude-limits recorded the same);
# kept as the single record of the entry point. Build it with an explicit path:
# `nova build src/crew_harness.nv`.
[[bin]]
name = "crew-harness"
path = "src/crew_harness.nv"

[[bin]]
name = "crew-hub"
path = "src/crew_hub.nv"
