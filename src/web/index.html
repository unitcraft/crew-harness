<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Пульт CrewHarness</title>
<!-- Стили и скрипты — ОТДЕЛЬНЫЕ ФАЙЛЫ, а не встроенные блоки: страницу отдаёт сервис целиком с
     запретом встроенного кода (CSP), и страница со встроенным <style> или <script> пуста.
     Ничего не грузится с чужих адресов: ни шрифты, ни скрипты, ни картинки, ни значки (они встроены в эту страницу, источник — icons.svg).
     theme.js — обычный скрипт без отложенной загрузки: ставит выбранную тему до первой отрисовки,
     чтобы страница не мигала чужой темой. Всё остальное — модули (app.js).
     Видимого текста в этом файле нет: все надписи рисует view.js из strings.js. -->
<link rel="stylesheet" href="app.css">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<script src="boot-guard.js"></script>
<script src="theme.js"></script>
</head>
<body>
<!-- Спрайт значков встроен в страницу: ссылки <use href="#i-имя"> не ходят в сеть, значки не пропадают при сбое отдельного файла.
     Источник — icons.svg; test/sprite.test.mjs следит, чтобы встроенный набор совпадал с ним. -->
<svg class="sprite" width="0" height="0" aria-hidden="true" focusable="false">
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.2-4.2"/></symbol>

  <symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
  <symbol id="i-chevron-down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></symbol>
  <symbol id="i-return" viewBox="0 0 24 24"><path d="M9 10l-5 5 5 5M20 4v7a4 4 0 0 1-4 4H4"/></symbol>
  <symbol id="i-stop" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2" fill="currentColor"/></symbol>
  <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6L7 7M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></symbol>
  <symbol id="i-monitor" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></symbol>
  <symbol id="i-panel" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></symbol>

  <symbol id="i-branch" viewBox="0 0 24 24"><circle cx="6" cy="5" r="2"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="8" r="2"/><path d="M6 7v10M18 10v1a4 4 0 0 1-4 4H8"/></symbol>

  <symbol id="i-file-plus" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8zM14 3v5h5M12 12v6M9 15h6"/></symbol>

  <symbol id="i-dot" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="currentColor"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
  <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 3L5 14h6l-1 7 8-11h-6z"/></symbol>
</svg>

<div class="app" id="app" data-pane="list" data-rail="auto">
  <div class="side-col">
    <aside class="side" id="side"></aside>
    <footer class="status" id="status" role="status" aria-live="polite"></footer>
  </div>
  <main class="main" id="main"></main>
  <aside class="rail" id="rail"></aside>
</div>

<div class="overlay" id="overlay" hidden></div>

<script type="module" src="app.js"></script>
</body>
</html>
